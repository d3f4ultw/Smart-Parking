spring.application.name=${SPRING_APPLICATION_NAME}
spring.profiles.active=${SPRING_PROFILE}

server.address=${API_BIND_ADDRESS}
server.port=${API_PORT}

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie

smartparking.correo.habilitado=${SMTP_ENABLED:false}
smartparking.correo.remitente=${SMTP_FROM:noreply@smartparking.local}
smartparking.operadores.origen-activacion=${OPERADORES_ORIGEN_ACTIVACION:}
smartparking.operadores.permitir-http-local=${OPERADORES_PERMITIR_HTTP_LOCAL:false}
smartparking.rfid1.token-sha256=${RFID1_TOKEN_SHA256:}
smartparking.rfid.salida-manual.clave=${RFID_SALIDA_MANUAL_CLAVE_HEX:}
smartparking.clientes.membresia.producto-id=prod_VTMowkF8XuDWIR
smartparking.clientes.membresia.precio-id=price_1USQ5HAqtHmR2qmyAWwUp5vy
smartparking.clientes.membresia.nombre=Smart Parking - Membres\u00EDa Mensual
smartparking.clientes.membresia.importe-menor-unidad=39900
smartparking.clientes.membresia.moneda=MXN
smartparking.clientes.membresia.intervalo=month
smartparking.clientes.membresia.intervalo-cantidad=1
smartparking.clientes.membresia.stripe.api-key=${STRIPE_API_KEY:}
smartparking.clientes.membresia.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
smartparking.clientes.membresia.stripe.web-base-url=${STRIPE_RETURN_ORIGIN:http://localhost:3000}
smartparking.clientes.membresia.stripe.api-version=2026-08-26.dahlia
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.protocol=${SMTP_PROTOCOL:smtp}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.test-connection=${SMTP_TEST_CONNECTION:false}
spring.mail.properties[mail.smtp.auth]=${SMTP_AUTH:false}
spring.mail.properties[mail.smtp.starttls.enable]=${SMTP_STARTTLS_ENABLE:false}
spring.mail.properties[mail.smtp.connectiontimeout]=${SMTP_CONNECTION_TIMEOUT:5000}
spring.mail.properties[mail.smtp.timeout]=${SMTP_READ_TIMEOUT:3000}
spring.mail.properties[mail.smtp.writetimeout]=${SMTP_WRITE_TIMEOUT:5000}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.mail.enabled=false
