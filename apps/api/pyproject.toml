[project]
name = "smart-parking-api"
version = "0.1.0"
description = "Backend FastAPI para Smart Parking"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic==1.20.0",
    "argon2-cffi==25.1.0",
    "email-validator==2.3.0",
    "fastapi==0.141.1",
    "psycopg[binary]==3.3.6",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.54",
    "uvicorn[standard]==0.53.0",
]

[dependency-groups]
dev = [
    "httpx2==2.13.0",
    "pyright[nodejs]==1.1.414",
    "pytest==9.1.1",
    "ruff==0.16.9",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 88
exclude = [
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["app", "main.py", "tests", "alembic"]
exclude = [
    "**/__pycache__",
    "**/.pytest_cache",
    "**/.ruff_cache",
    "**/.venv",
]
pythonVersion = "3.14"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
