name: ${TEST_PROJECT_NAME:?Define TEST_PROJECT_NAME fuera del repositorio}

services:
  db:
    image: docker.io/library/postgres:18.6-bookworm
    command: ["postgres", "-p", "5432"]
    environment:
      POSTGRES_DB: ${TEST_POSTGRES_DB:?Define TEST_POSTGRES_DB fuera del repositorio}
      POSTGRES_USER: ${TEST_POSTGRES_USER:?Define TEST_POSTGRES_USER fuera del repositorio}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?Define TEST_POSTGRES_PASSWORD fuera del repositorio}
      PGPORT: "5432"
    volumes:
      - datos_temporales:/var/lib/postgresql
    networks:
      - red_temporal
    labels:
      com.smartparking.testing.run: ${TEST_PROJECT_NAME:?}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p 5432 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  mailpit:
    image: docker.io/axllent/mailpit:v1.32.0
    ports:
      - "127.0.0.1::8025"
    networks:
      - red_temporal
    labels:
      com.smartparking.testing.run: ${TEST_PROJECT_NAME:?}

  api:
    build:
      context: ../../../services/api
      dockerfile: Containerfile
      labels:
        com.smartparking.testing.run: ${TEST_PROJECT_NAME:?}
    environment:
      POSTGRES_DB: ${TEST_POSTGRES_DB:?}
      POSTGRES_USER: ${TEST_POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      API_BIND_ADDRESS: 0.0.0.0
      API_PORT: "8080"
      SPRING_PROFILE: test
      SPRING_APPLICATION_NAME: smartparking-api-test
      SESSION_TIMEOUT: ${TEST_SESSION_TIMEOUT:-30m}
      SESSION_COOKIE_SECURE: "false"
      SMTP_ENABLED: "true"
      SMTP_HOST: ${TEST_SMTP_HOST:-mailpit}
      SMTP_PORT: "1025"
      SMTP_PROTOCOL: smtp
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_AUTH: "false"
      SMTP_STARTTLS_ENABLE: "false"
      SMTP_CONNECTION_TIMEOUT: "1500"
      SMTP_READ_TIMEOUT: "1500"
      SMTP_WRITE_TIMEOUT: "1500"
      SMTP_FROM: owner-console-test@smartparking.example.test
      SMTP_TEST_CONNECTION: "false"
    ports:
      - "127.0.0.1::8080"
    networks:
      - red_temporal
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    labels:
      com.smartparking.testing.run: ${TEST_PROJECT_NAME:?}

volumes:
  datos_temporales:

networks:
  red_temporal:
    driver: bridge
    internal: true
