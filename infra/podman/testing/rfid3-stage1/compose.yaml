name: ${RFID3_STAGE1_PROJECT_NAME:?Proyecto desechable requerido}

services:
  db:
    image: docker.io/library/postgres:18.6-bookworm
    environment:
      POSTGRES_DB: ${RFID3_STAGE1_POSTGRES_DB:?}
      POSTGRES_USER: ${RFID3_STAGE1_POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${RFID3_STAGE1_POSTGRES_PASSWORD:?}
    volumes:
      - datos:/var/lib/postgresql
    networks: [pruebas]
    ports: ["127.0.0.1::5432"]
    labels:
      com.smartparking.testing.run: ${RFID3_STAGE1_PROJECT_NAME:?}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    image: localhost/${RFID3_STAGE1_PROJECT_NAME:?}-api:stage1
    build:
      context: ../../../../services/api
      dockerfile: ../../infra/podman/testing/rfid1/Containerfile.offline
      network: none
    environment:
      POSTGRES_DB: ${RFID3_STAGE1_POSTGRES_DB:?}
      POSTGRES_USER: ${RFID3_STAGE1_POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${RFID3_STAGE1_POSTGRES_PASSWORD:?}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      API_BIND_ADDRESS: 0.0.0.0
      API_PORT: "8080"
      SPRING_PROFILE: test
      SPRING_APPLICATION_NAME: smartparking-rfid3-stage1
      SESSION_TIMEOUT: 30m
      SESSION_COOKIE_SECURE: "false"
      SMTP_ENABLED: "false"
      RFID1_TOKEN_SHA256: ${RFID3_STAGE1_TOKEN_SHA256:?}
    networks: [pruebas]
    ports: ["127.0.0.1::8080"]
    depends_on:
      db:
        condition: service_healthy
    labels:
      com.smartparking.testing.run: ${RFID3_STAGE1_PROJECT_NAME:?}

volumes:
  datos:

networks:
  pruebas:
    driver: bridge
    internal: true
