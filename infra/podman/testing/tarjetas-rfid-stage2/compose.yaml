name: ${RFID1_STAGE2_PROJECT_NAME:?Define un proyecto desechable Stage 2}

services:
  db:
    image: docker.io/library/postgres:18.6-bookworm
    command:
      - postgres
      - -p
      - "5432"
      - -c
      - log_min_error_statement=panic
      - -c
      - log_parameter_max_length_on_error=0
      - -c
      - log_statement=none
    environment:
      POSTGRES_DB: ${RFID1_STAGE2_POSTGRES_DB:?}
      POSTGRES_USER: ${RFID1_STAGE2_POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${RFID1_STAGE2_POSTGRES_PASSWORD:?}
      PGPORT: "5432"
    volumes:
      - datos:/var/lib/postgresql
    networks:
      - red_stage2
    labels:
      com.smartparking.testing.run: ${RFID1_STAGE2_PROJECT_NAME:?}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -p 5432 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  api:
    image: localhost/${RFID1_STAGE2_PROJECT_NAME:?}-api:stage2
    pull_policy: never
    build:
      context: ../../../../services/api
      dockerfile: ../../infra/podman/testing/rfid1/Containerfile.offline
      network: none
      labels:
        com.smartparking.testing.run: ${RFID1_STAGE2_PROJECT_NAME:?}
    environment:
      POSTGRES_DB: ${RFID1_STAGE2_POSTGRES_DB:?}
      POSTGRES_USER: ${RFID1_STAGE2_POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${RFID1_STAGE2_POSTGRES_PASSWORD:?}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      API_BIND_ADDRESS: 0.0.0.0
      API_PORT: "8080"
      SPRING_PROFILE: test
      SPRING_APPLICATION_NAME: smartparking-api-tarjetas-stage2
      SESSION_TIMEOUT: 30m
      SESSION_COOKIE_SECURE: "false"
      SMTP_ENABLED: "false"
      RFID1_TOKEN_SHA256: ${RFID1_STAGE2_TOKEN_SHA256:?}
    ports:
      - "127.0.0.1::8080"
    networks:
      - red_stage2
    depends_on:
      db:
        condition: service_healthy
    labels:
      com.smartparking.testing.run: ${RFID1_STAGE2_PROJECT_NAME:?}

  web:
    image: localhost/${RFID1_STAGE2_PROJECT_NAME:?}-web:stage2
    pull_policy: never
    build:
      context: ../../../../apps/web
      dockerfile: Containerfile
      target: runtime
      labels:
        com.smartparking.testing.run: ${RFID1_STAGE2_PROJECT_NAME:?}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      NUXT_API_INTERNAL_BASE: http://api:8080
      NUXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1::3000"
    networks:
      - red_stage2
    volumes:
      - type: bind
        source: ../../../../apps/web/tests/rfid1-bff.mjs
        target: /tests/rfid1-bff.mjs
        read_only: true
    depends_on:
      api:
        condition: service_started
    labels:
      com.smartparking.testing.run: ${RFID1_STAGE2_PROJECT_NAME:?}

  web_checks:
    profiles:
      - checks
    image: localhost/${RFID1_STAGE2_PROJECT_NAME:?}-web-checks:stage2
    pull_policy: never
    build:
      context: ../../../../apps/web
      dockerfile: Containerfile
      target: build
      labels:
        com.smartparking.testing.run: ${RFID1_STAGE2_PROJECT_NAME:?}
    command:
      - pnpm
      - run
      - check
    environment:
      NUXT_TELEMETRY_DISABLED: "1"
    networks:
      - red_stage2
    labels:
      com.smartparking.testing.run: ${RFID1_STAGE2_PROJECT_NAME:?}

  browser:
    profiles:
      - browser
    network_mode: service:web
    working_dir: /workspace
    image: localhost/${RFID1_STAGE2_PROJECT_NAME:?}-browser:stage2
    pull_policy: never
    build:
      context: ../../../../apps/web/tests/browser
      dockerfile: ../../../../infra/podman/testing/rfid1-stage3/Containerfile.browser
      labels:
        com.smartparking.testing.run: ${RFID1_STAGE2_PROJECT_NAME:?}
    command:
      - pnpm
      - exec
      - playwright
      - test
      - --config=playwright.config.ts
      - tarjetas-rfid/
    environment:
      BASE_URL: http://localhost:3000
      TEST_WEB_BASE_URL: http://localhost:3000
      TEST_API_BASE_URL: http://api:8080
      TEST_OWNER_EMAIL: ${RFID1_STAGE2_OWNER_EMAIL:?}
      TEST_OWNER_PASSWORD: ${RFID1_STAGE2_OWNER_PASSWORD:?}
      TEST_CLIENT_EMAIL: ${RFID1_STAGE2_CLIENT_EMAIL:?}
      TEST_CLIENT_PASSWORD: ${RFID1_STAGE2_CLIENT_PASSWORD:?}
      TEST_DEVICE_TOKEN: ${RFID1_STAGE2_DEVICE_TOKEN:?}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    depends_on:
      web:
        condition: service_started
    labels:
      com.smartparking.testing.run: ${RFID1_STAGE2_PROJECT_NAME:?}

volumes:
  datos:
    labels:
      com.smartparking.testing.run: ${RFID1_STAGE2_PROJECT_NAME:?}

networks:
  red_stage2:
    driver: bridge
    internal: true
    labels:
      com.smartparking.testing.run: ${RFID1_STAGE2_PROJECT_NAME:?}
