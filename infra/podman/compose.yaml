name: smartparking

services:
  db:
    image: postgres:18.6-bookworm
    command: ["postgres", "-p", "${POSTGRES_PORT:?Define POSTGRES_PORT en infra/podman/.env}"]
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?Define POSTGRES_PORT en infra/podman/.env}:${POSTGRES_PORT:?Define POSTGRES_PORT en infra/podman/.env}"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?Define POSTGRES_DB en infra/podman/.env}"
      POSTGRES_USER: "${POSTGRES_USER:?Define POSTGRES_USER en infra/podman/.env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en infra/podman/.env}"
      POSTGRES_PORT: "${POSTGRES_PORT:?Define POSTGRES_PORT en infra/podman/.env}"
      PGPORT: "${POSTGRES_PORT:?Define POSTGRES_PORT en infra/podman/.env}"
    volumes:
      - postgres_datos:/var/lib/postgresql
    networks:
      - red_privada
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -p "$${POSTGRES_PORT}" -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    image: localhost/smartparking-api:20261112-094157@sha256:f7c018e186b3adc4a8bd43bb3bbc17b2f9775e6c330e337777bc04257000fd1f
    pull_policy: never
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?Define POSTGRES_DB en infra/podman/.env}"
      POSTGRES_USER: "${POSTGRES_USER:?Define POSTGRES_USER en infra/podman/.env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en infra/podman/.env}"
      POSTGRES_HOST: "${POSTGRES_HOST:?Define POSTGRES_HOST en infra/podman/.env}"
      POSTGRES_PORT: "${POSTGRES_PORT:?Define POSTGRES_PORT en infra/podman/.env}"
      API_BIND_ADDRESS: "${API_BIND_ADDRESS:?Define API_BIND_ADDRESS en infra/podman/.env}"
      API_PORT: "${API_PORT:?Define API_PORT en infra/podman/.env}"
      SPRING_PROFILE: "${SPRING_PROFILE:?Define SPRING_PROFILE en infra/podman/.env}"
      SPRING_APPLICATION_NAME: "${SPRING_APPLICATION_NAME:?Define SPRING_APPLICATION_NAME en infra/podman/.env}"
      RFID1_TOKEN_SHA256: "${RFID1_TOKEN_SHA256:?Define RFID1_TOKEN_SHA256 en infra/podman/.env}"
      RFID_SALIDA_MANUAL_CLAVE_HEX: "${RFID_SALIDA_MANUAL_CLAVE_HEX:-}"
      OPERADORES_ORIGEN_ACTIVACION: "${OPERADORES_ORIGEN_ACTIVACION:-}"
      OPERADORES_PERMITIR_HTTP_LOCAL: "${OPERADORES_PERMITIR_HTTP_LOCAL:-false}"
      SESSION_TIMEOUT: "${SESSION_TIMEOUT:-30m}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-false}"
      SMTP_ENABLED: "${SMTP_ENABLED:-false}"
      SMTP_HOST: "${SMTP_HOST:-mailpit}"
      SMTP_PORT: "${SMTP_PORT:-1025}"
      SMTP_PROTOCOL: "${SMTP_PROTOCOL:-smtp}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_AUTH: "${SMTP_AUTH:-false}"
      SMTP_STARTTLS_ENABLE: "${SMTP_STARTTLS_ENABLE:-false}"
      SMTP_CONNECTION_TIMEOUT: "${SMTP_CONNECTION_TIMEOUT:-5000}"
      SMTP_READ_TIMEOUT: "${SMTP_READ_TIMEOUT:-3000}"
      SMTP_WRITE_TIMEOUT: "${SMTP_WRITE_TIMEOUT:-5000}"
      SMTP_FROM: "${SMTP_FROM:-noreply@smartparking.local}"
      SMTP_TEST_CONNECTION: "${SMTP_TEST_CONNECTION:-false}"
      SMARTPARKING_VISION_FUENTE_ID: "${SMARTPARKING_VISION_FUENTE_ID:-}"
      SMARTPARKING_VISION_LIMPIEZA_INTERVALO_MS: "${SMARTPARKING_VISION_LIMPIEZA_INTERVALO_MS:-30000}"
      SMARTPARKING_VISION_MAX_RECIBOS_POR_FUENTE: "${SMARTPARKING_VISION_MAX_RECIBOS_POR_FUENTE:-1000}"
      SMARTPARKING_VISION_RETENCION_RECIBOS_SEGUNDOS: "${SMARTPARKING_VISION_RETENCION_RECIBOS_SEGUNDOS:-3600}"
      SMARTPARKING_VISION_TOKEN_SHA256: "${SMARTPARKING_VISION_TOKEN_SHA256:-}"
    ports:
      - "${API_HOST:?Define API_HOST en infra/podman/.env}:${API_PORT:?Define API_PORT en infra/podman/.env}:${API_PORT:?Define API_PORT en infra/podman/.env}"
    networks:
      - red_privada
      - api_web_privada
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent "http://127.0.0.1:$${API_PORT}/actuator/health" >/dev/null
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - red_privada

  web:
    image: localhost/smartparking-web:20261112-094157@sha256:91d560fe37c770f6cdfc027d88b14dd1aa597c7edb94818d1fbef2b0e97dcbeb
    pull_policy: never
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      NUXT_API_INTERNAL_BASE: "http://api:${API_PORT:?Define API_PORT en infra/podman/.env}"
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    networks:
      - web_local
      - api_web_privada
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/panel').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  vision:
    image: localhost/smartparking-vision:20261112-094157@sha256:44841636ac4d7919cb0f32fb0351d341f141e71c299a0f1659a6a071b81f844b
    pull_policy: never
    container_name: smartparking-vision
    profiles:
      - vision-runtime
    init: true
    command:
      - /bin/sh
      - -ec
      - |
        until [ -s /data/config/http-usb-url.txt ] && [ -s /data/models/yolo26n.pt ]; do sleep 10; done
        huella="$$(sha256sum /data/config/http-usb-url.txt | cut -d ' ' -f1)"
        exec flock --no-fork /cache/locks/vision-inferencia.lock flock --no-fork "/cache/locks/$${huella}.lock" python /opt/smartparking/vision-recarga-controlada.py -- python /app/detect.py \
          --permanente --headless --publish-java --control-socket /run/vision-control/control.sock \
          --local-proposal /data/local-calibration/zones.json --zones /data/config/zones.json \
          --model /data/models/yolo26n.pt --source http
    environment:
      VISION_CONFIG_DIR: /data/config
      VISION_HTTP_URL_FILE: /data/config/http-usb-url.txt
      VISION_JAVA_URL: "${VISION_JAVA_URL:-}"
      VISION_JAVA_HTTP_PRIVADO: "${VISION_JAVA_HTTP_PRIVADO:-}"
      VISION_FUENTE_ID: "${VISION_FUENTE_ID:-}"
      VISION_REVISION_CALIBRACION: "${VISION_REVISION_CALIBRACION:-}"
      VISION_HASH_CALIBRACION: "${VISION_HASH_CALIBRACION:-}"
      VISION_TOKEN_ARCHIVO: "${VISION_TOKEN_ARCHIVO:-}"
      DISPLAY: "${DISPLAY:-:0}"
      XAUTHORITY: /run/vision-control/vision.Xauthority
      QT_QPA_PLATFORM: xcb
      QT_XCB_NO_MITSHM: "1"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "2"
      OPENCV_LOG_LEVEL: ERROR
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ../../var/vision/config:/data/config:rw
      - ../../var/vision/models:/data/models:ro
      - ../../var/vision/cache:/cache:rw
      - ../../var/vision/escritorio-local/calibracion:/data/local-calibration:rw
      - ${XDG_RUNTIME_DIR:?Se requiere XDG_RUNTIME_DIR}/smartparking-vision:/run/vision-control:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
    network_mode: host
    userns_mode: keep-id
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cpus: 6
    mem_limit: 4g
    pids_limit: 256
    restart: "no"

volumes:
  postgres_datos:

networks:
  red_privada:
    driver: bridge
  web_local:
    driver: bridge
  api_web_privada:
    driver: bridge
    internal: true
